# Gcore VM (185.188.146.160), minegnk.com points here directly. Use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.gcore.yml up -d --build
# Only Caddy is public (80/443, TLS); the app is reachable only inside the compose network.
services:
  web:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here; losing them means re-issuing and Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
